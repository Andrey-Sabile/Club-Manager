<div class="p-4 flex flex-row justify-between">
    <h1 class="text-3xl text-center font-bold">Clubs</h1>
    <a [routerLink]="['/clubs/new-club']"><button class="btn btn-primary btn-sm">Create Club</button></a>
</div>
<div class="content-container p-4">    
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        @for (club of clubList; track club) {
            <div class="card card-compact hover:cursor-pointer hover:bg-base-300" routerLink="/clubs/{{club.id}}">
                <div class="card-body">
                    <div class="flex">
                        <div class="avatar placeholder">
                            <div class="bg-base-200 rounded-full w-16">
                                <span class="text-3xl">P</span>
                              </div>
                        </div>
                        <div class="ml-4">
                            <h2 class="card-title text-center">{{ club.name }}</h2>
                            <p>{{ club.description }}</p>
                            <div class="flex gap-2">
                                <fa-icon [icon]="faEnvelope"></fa-icon> <p>{{ club.contactEmail }}</p>
                            </div>        
                        </div>
                    </div>
                </div>
            </div>
        }
    </div>    
</div>
<div class="mt-12"></div>
<app-event-list></app-event-list>
