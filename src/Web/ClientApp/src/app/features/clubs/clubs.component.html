<div>
    <h1 class="text-2xl text-center">Clubs</h1>
    <a [routerLink]="['/clubs/new-club']"><button class="btn btn-primary">Create Club</button></a>
</div>

<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>ContactEmail</th>
        </tr>
    </thead>
    <tbody>
        @for (club of clubList; track club) {
            <tr class="hover:bg-base-200 hover:cursor-pointer" routerLink="/clubs/{{club.id}}">
                <th>{{ club.name}}</th>
                <th>{{ club.contactEmail}}</th>
            </tr>
        }
    </tbody>
</table>
