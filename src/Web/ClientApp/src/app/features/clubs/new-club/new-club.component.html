<div class="content-container mx-auto p-4 mt-8 max-w-screen-md">
    <div class="grid grid-cols-1 gap-4 p-4">
        <h1 class="text-3xl text-center font-bold">Create a Club</h1>

        <form [formGroup]="newClubForm">
            <label class="form-control" for="name">
                <div class="label">
                    <span class="label-text">Name</span>
                </div>
                <input type="text" id="name" formControlName="name" class="input input-bordered" required 
                    [ngClass]="{'input-error': newClubForm.controls.name.invalid && newClubForm.controls.name.dirty}"/>
                @if (newClubForm.controls.name.invalid && newClubForm.controls.name.dirty) {
                    <div class="label">
                        <span class="label-text-alt">Name cannot be empty</span>
                    </div>
                }
            </label>

            <label class="form-control" for="contactEmail">
                <div class="label">
                    <span class="label-text">Contact Email</span>
                </div>
                <input type="text" id="contactEmail" formControlName="contactEmail" class="input input-bordered"
                [ngClass]="{'input-error': newClubForm.controls.contactEmail.invalid && newClubForm.controls.contactEmail.dirty}"/>
                @if (newClubForm.controls.contactEmail.invalid && newClubForm.controls.contactEmail.dirty) {
                    <div class="label">
                        <span class="label-text-alt">Email cannot be empty</span>
                    </div>
                }
            </label>

            <label class="form-control">
                <div class="label">
                    <span class="label-text">Description</span>
                </div>
                <textarea class="textarea textarea-bordered textarea-md w-full" formControlName="description" 
                [ngClass]="{'textarea-error': newClubForm.controls.description.invalid && newClubForm.controls.description.dirty}"></textarea>
                @if (newClubForm.controls.description.invalid && newClubForm.controls.description.dirty) {
                    <div class="label">
                        <span class="label-text-alt">Description cannot be empty</span>
                    </div>
                }
            </label>

            <button type="submit" class="btn btn-primary float-end mt-4" (click)="createClub()" [disabled]="newClubForm.invalid">Create Club</button>

        </form>
    </div>
</div>
