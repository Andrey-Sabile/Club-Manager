@if (!hasSignedUp) {
    <div class="mt-3">
        <h1 class="text-3xl text-center mb-3">Sign Up for {{club.name}}</h1>
        <form [formGroup]="newMemberForm">
            <label for="first-name" class="input input-bordered flex items-center gap-2">
                First Name
                <input id="first-name" formControlName="firstName" class="grow" type="text">
            </label>
    
            <label for="last-name" class="input input-bordered flex items-center gap-2">
                Last Name
                <input  id="last-name" formControlName="lastName" class="grow" type="text">
            </label>
    
            <label for="email" class="input input-bordered flex items-center gap-2">
                Email
                <input id="email" formControlName="email" class="grow" type="email">
            </label>
    
            <div class="form-control">
                <label for="is-fresher" class="label bordered flex items-center gap-2 cursor-pointer">
                    Are you a first year?
                    <input id="is-fresher" formControlName="isFresher" type="checkbox" class="checkbox checkbox-primary">
                </label>
            </div>
    
            <button class="btn btn-primary" (click)="createMember()">Create Member</button>
        </form>
    </div>    
}

@if (hasSignedUp) {
    <article class="prose-2xl">
        <h1>Success!</h1>
    </article>    
}
