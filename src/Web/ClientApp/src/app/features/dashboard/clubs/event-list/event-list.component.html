<h1 class="text-2xl font-bold mt-6">All Events</h1>
<div class="grid grid-cols-1 gap-4 md:grid-cols-3 mt-6">
    @for (event of eventsList; track event) {
    <div class="card card-compact content-container hover:cursor-pointer hover:bg-base-200">
        <div class="card-body">
            <h2 class="card-title">{{ event.name }}</h2>
            <div class="flex gap-1">
            </div>
        </div>
    </div>
    }
</div>
