<div class="container flex justify-center">
    <div class="flex flex-col w-96 shadow-md p-2">
        <div class="mb-6">
            <h1 class="text-center text-4xl">{{event.name}}</h1>
        </div>

        @if (showEventInformation) {
            <div class="mb-6">
                <h2 class="text-xl mb-2">Date and Time</h2>
                <div class="flex flex-row">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path d="M12.75 12.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM7.5 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM8.25 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM9.75 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM10.5 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM12.75 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM14.25 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM15 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM16.5 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM15 12.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM16.5 13.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" />
                        <path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 0 1 7.5 3v1.5h9V3A.75.75 0 0 1 18 3v1.5h.75a3 3 0 0 1 3 3v11.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3H6V3a.75.75 0 0 1 .75-.75Zm13.5 9a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5Z" clip-rule="evenodd" />
                    </svg>
                    {{event.when}}
                </div>
            </div>

            <div class="mb-6">
                <h2 class="text-xl mb-2">Location</h2>
                <div class="flex flex-row">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="m11.54 22.351.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.975 16.975 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 0 0-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 0 0 2.682 2.282 16.975 16.975 0 0 0 1.145.742ZM12 13.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
                    </svg>
                    {{event.location}}
                </div>
            </div>

            <div class="mb-2">
                <h2 class="text-xl mb-3">Tickets</h2>
                <form [formGroup]="ticketTypeForm">
                    <div formArrayName="ticketTypesFormArray">
                        @for (ticketType of ticketTypesFormArray.controls; track $index) {
                            
                        }
                    </div>
                </form>
            </div>

            <div>
                <button class="btn btn-primary float-right" (click)="showBuyerFormPage()">Continue</button>
            </div>
        }

        @if (showBuyerForm) {
            <div>
                <h2 class="text-xl mb-3">Attendee Information</h2>
                <form [formGroup]="ticketForm">
                    <label for="firstName" class="input input-bordered flex items-center gap-2 mb-2">
                        First Name
                        <input id="firstName" formControlName="firstName" class="grow" type="text">
                    </label>
                    <label for="lastName" class="input input-bordered flex items-center gap-2 mb-2">
                        Last Name
                        <input id="lastName" formControlName="lastName" class="grow" type="text">
                    </label>
                    <label for="email" class="input input-bordered flex items-center gap-2 mb-2">
                        Email
                        <input id="email" formControlName="email" class="grow" type="email">
                    </label>
                </form>
                <div>
                    <button class="btn" (click)="showEventInformationPage()">Back</button>
                    <button class="btn btn-primary float-right" (click)="showSummaryPage()">Continue</button>
                </div>
            </div>
        }

        @if (showSummary) {
            <div>
                <h2 class="text-xl mb-3">Ticket Summary</h2>
                <div>
                    <button class="btn" (click)="showBuyerFormPage()">Back</button>
                    <button class="btn btn-primary float-right" (click)="showSummaryPage()">Buy Tickets</button>
                </div>
            </div>
        }
    </div>
</div>
