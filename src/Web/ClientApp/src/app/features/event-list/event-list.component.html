<div>
    <h1 class="text-3xl text-center">Events</h1>
</div>

<table class="table">
    <thead>
        <tr>
            <th>Event</th>
            <th>Time and date</th>
            <th>Location</th>
        </tr>
    </thead>
    <tbody>
        @for (event of eventsList; track event){
            <tr>
                <th>{{ event.name }}</th>
                <th>{{ event.when }}</th>
                <th>{{ event.location }}</th>
            </tr>
        }
    </tbody>
</table>
