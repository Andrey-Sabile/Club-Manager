<div class="container">
    <div class="grid grid-cols-1 gap-4">
        <div>
            <h1 class="text-2xl text-center">Events</h1>
            <a [routerLink]="['/new-event']"><button class="btn btn-primary">Create Event</button></a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Time and date</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                @for (event of eventsList; track event){
                    <tr class="hover:bg-base-200 hover:cursor-pointer" routerLink="/events/{{event.id}}">
                        <th>{{ event.name }}</th>
                        <th>{{ event.when }}</th>
                        <th>{{ event.location }}</th>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
