<h1 class="text-3xl text-center font-bold mt-8">Create an event</h1>
<div class="content-container grid grid-cols-1 gap-4 p-4 mt-6">
    <div class="flex flex-col">
        <h2 class="text-xl">Basic Info</h2>
        <form [formGroup]="newEventForm">
            <label class="form-control" for="name">
                <div class="label">
                    <span class="label-text">Name</span>
                </div>
                <input type="text" id="name" formControlName="name" class="input input-bordered" required/>
            </label>

            <label class="form-control" for="location">
                <div class="label">
                    <span class="label-text">Location</span>
                </div>
                <input type="text" id="location" formControlName="location" class="input input-bordered" required/>
            </label>

            <label class="form-control" for="when">
                <div class="label">
                    <span class="label-text">When</span>
                </div>
                <input type="datetime-local" id="when" formControlName="when" class="input input-bordered" required/>
            </label>            

            <label class="form-control">
                <div class="label">
                    <span class="label-text">Description</span>
                </div>
                <textarea class="textarea textarea-bordered textarea-md w-full" formControlName="description"></textarea>
            </label>            

        </form>
    </div>

    <div class="mt-6">
        <h2 class="text-xl">Ticket Info</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                @for (ticketType of ticketTypes; track ticketType){
                    <tr>
                        <th>{{ ticketType.name }}</th>
                        <th>{{ ticketType.price }}</th>
                        <th>{{ ticketType.quantity }}</th>
                    </tr>
                }
            </tbody>
        </table>
        <button class="btn btn-secondary" onclick="ticket_type.showModal()">Add Ticket Type</button>
    </div>

    <div>
        <button class="btn btn-primary float-end" type="submit" (click)="createEvent()" >Create Event</button>
    </div>
</div>

<dialog id="ticket_type" class="modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="text-lg">Create Ticket Type</h3>
        <form [formGroup]="ticketTypeForm">
            <label for="ticket-name" class="input input-bordered flex items-center gap-2">
                Name
                <input id="ticket-name" formControlName="name" class="grow" type="text">
            </label>
            <label for="ticket-price" class="input input-bordered flex items-center gap-2">
                Price
                <input id="ticket-price" formControlName="price" class="grow" type="number">
            </label>
            <label for="ticket-quantity" class="input input-bordered flex items-center gap-2">
                Quantity
                <input id="ticket-quantity" formControlName="quantity" class="grow" type="number">
            </label>
            <div class="modal-action">
                <button class="btn btn-primary" (click)="addTicketType()" onclick="ticket_type.close()" >Add Ticket Type</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button></button>
    </form>
</dialog>
