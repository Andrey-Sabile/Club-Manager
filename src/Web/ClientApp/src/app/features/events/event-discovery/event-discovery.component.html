<h1 class="text-2xl font-bold mt-6">Discover Events</h1>
<div class="content-container p-4 mt-4">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        @for (event of eventsList; track event) {
        <div class="card card-compact content-container hover:cursor-pointer hover:bg-base-200"
            routerLink="/events/{{event.id}}">
            <div class="card-body">
                <p>{{ event.when | date:'mediumDate'}}</p>
                <h2 class="card-title">{{ event.name }}</h2>
                <div class="flex gap-1">
                    <fa-icon [icon]="eventLocationDot"></fa-icon>
                    <h3 class="font-light">{{event.location}}</h3>
                </div>
            </div>
        </div>
        }
    </div>
</div>
