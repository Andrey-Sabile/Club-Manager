<div class="p-4">
  <div class="flex flex-row justify-between mb-4">
    <h1 class="text-3xl text-center font-bold">Clubs</h1>
  </div>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (club of clubList; track club) {
    <div class="card card-compact content-container hover:cursor-pointer hover:bg-base-300"
      routerLink="/clubs/{{club.id}}">
      <div class="card-body">
        <div class="flex">
          <div class="avatar placeholder">
            <div class="bg-base-200 rounded-full w-16">
              <img src="{{ this.clubLogoPath + club.logoUrl }}">
            </div>
          </div>
          <div class="ml-4">
            <h2 class="card-title text-center">{{ club.name }}</h2>
            <div class="flex gap-1">
              <fa-icon [icon]="faEnvelope"></fa-icon>
              <p class="font-light">{{ club.contactEmail }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</div>
<div class="mt-12"></div>

<div class="p-4">
  <h1 class="text-3xl font-bold mb-4">Events</h1>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (event of eventsList; track event) {
    <div class="card card-compact content-container hover:cursor-pointer hover:bg-base-200"
      routerLink="/events/{{event.id}}">
      <div class="card-body">
        <h2 class="card-title">{{ event.name }}</h2>
        <div class="flex gap-1">
          <fa-icon [icon]="faLocationDot"></fa-icon>
          <h3 class="font-light">{{event.location}}</h3>
        </div>
      </div>
    </div>
    }
  </div>
</div>
